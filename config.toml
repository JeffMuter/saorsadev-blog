baseURL = "https://saorsadev.com"
languageCode = "en-us"
title = "SaorsaDev"
theme = "digio"

[menus]
  [[menus.main]]
    name = "home"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "posts"
    pageRef = "/posts"
    weight = 2

[params]
  noindex = false
  nofollow = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[mediaTypes]
  [mediaTypes."text/html"]
    suffixes = ["html"]

[outputFormats]
  [outputFormats.HTML]
    mediaType = "text/html"
    baseName = "index"
